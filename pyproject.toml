[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "diehard-run-ekb-bot"
version = "0.1.0"
description = "Telegram bot for the Diehard running community in Yekaterinburg"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiogram==3.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
    "ruff==0.13.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.setuptools.packages.find]
include = ["bot*"]
